name: SE3 Labs
description: SE3 Labs is a European artificial intelligence company building spatial
  AI for autonomous systems, with a mission to enable machines to perceive, reason,
  and act autonomously in the physical world. Its technology performs real-time 3D
  reconstruction of operational environments, spatial understanding to orchestrate
  fleets of autonomous machines, and natural-language interfaces for commanding
  multiple machines at once. Early applications target the defence sector, including
  vision-based autonomy and multi-drone reconnaissance. SE3 Labs is backed by
  Seedcamp and works directly with government and military partners; it does not
  currently publish a public API, SDK, or developer documentation.
